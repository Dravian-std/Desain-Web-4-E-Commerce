<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Livora Furniture Marketplace</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/project.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <link rel="stylesheet" href="./assets/css/main.css">
  <link rel="stylesheet" href="./assets/css/tailwind.css">
</head>

<body class="font-sans antialiased selection:bg-oak-300 selection:text-charcoal-900">

  <div data-component="ambient"></div>
  <div data-component="navbar"></div>
  <main data-component="home"></main>
  <div data-component="footer"></div>

  <div data-component="cart-drawer"></div>
  <div data-component="modal-member"></div>
  <div data-component="modal-produk"></div>
  <div data-component="invoice-preview"></div>
  <div data-component="toast-script"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script type="module">
    async function loadComponent(el) {
      const name = el.dataset.component;
      try {
        const res = await fetch(`./components/${name}.html`);
        if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
        el.innerHTML = await res.text();
      } catch (err) {
        console.error(`Gagal memuat komponen "${name}":`, err);
      }
    }

    await Promise.all([...document.querySelectorAll('[data-component]')].map(loadComponent));

    const script = document.createElement('script');
    script.src = './assets/js/app.js';
    script.onload = () => {
      
      if (typeof window.onload === 'function') window.onload();
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
