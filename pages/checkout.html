<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Livora — Checkout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/project.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cream: { 50: '#FDFBF7', 100: '#F9F5EC', 200: '#F1E9DA', 300: '#E5D8C1' },
                        oak: {
                            100: '#F4E8D6', 200: '#E6CFAF', 300: '#D8B892', 400: '#C49A6C', 500: '#A97B4B',
                            600: '#8C6239', 700: '#6E4B2A', 800: '#52371F', 900: '#382515'
                        },
                        charcoal: { 800: '#26211D', 900: '#171412' },
                        sage: { 50: '#F2F6F3', 100: '#E1ECE4', 600: '#3D6B4E', 700: '#2E523B' }
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
                        serif: ['"Cormorant Garamond"', 'serif'],
                        mono: ['"JetBrains Mono"', 'monospace']
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/tailwind.css">
</head>

<body class="font-sans antialiased selection:bg-oak-300 selection:text-charcoal-900">

    <div data-component="ambient"></div>
    <div data-component="navbar" class="sticky top-0 z-40 min-h-[64px]"></div>

    <main id="page-checkout" class="page-section block py-5 py-lg-5">
        <div class="container">
            <div class="row g-4">
                <div class="col-lg-7">
                    <div class="glass-card rounded-4 p-4 p-lg-5">
                        <button class="btn btn-sm btn-outline-secondary mb-3" type="button" onclick="switchPage('katalog')">← Kembali belanja</button>
                        <h1 class="h3 fw-bold">Checkout Livora</h1>
                        <p class="text-secondary small">Isi data penerima dan alamat. Akun tidak wajib dibuat.</p>
                        <form id="checkout-form" class="row g-3">
                            <div class="col-md-6"><label class="form-label">Nama penerima</label><input class="form-control" name="name" required autocomplete="name"></div>
                            <div class="col-md-6"><label class="form-label">Email untuk invoice</label><input class="form-control" name="email" type="email" required autocomplete="email"></div>
                            <div class="col-md-6"><label class="form-label">Nomor HP / WhatsApp</label><input class="form-control" name="phone" type="tel" required placeholder="08xxxxxxxxxx" autocomplete="tel"></div>
                            <div class="col-md-6"><label class="form-label">Kode pos</label><input class="form-control" name="postal" required inputmode="numeric" placeholder="Contoh: 57100"></div>
                            <div class="col-12"><label class="form-label">Alamat lengkap</label><textarea class="form-control" name="address" rows="3" required placeholder="Nama jalan, nomor rumah, kecamatan, kota, provinsi"></textarea></div>
                            <div class="col-md-6"><label class="form-label">Kurir / layanan</label><select class="form-select" name="courier"><option>Livora Eco Cargo (estimasi)</option><option>JNE Trucking (estimasi)</option><option>SiCepat Gokil (estimasi)</option></select></div>
                            <div class="col-md-6"><label class="form-label">Pembayaran (simulasi)</label><select class="form-select" name="payment"><option>Transfer Bank Manual</option><option>Virtual Account (simulasi)</option><option>QRIS (simulasi)</option></select></div>
                            <div class="col-12"><div class="alert alert-warning small mb-0"><strong>Catatan prototipe:</strong> belum terhubung payment gateway, bank, email, atau SMS. Nomor VA/QRIS tidak diterbitkan sungguhan. Pesanan dicatat sebagai menunggu konfirmasi.</div></div>
                            <div class="col-12"><button class="btn btn-dark w-100 py-3" type="submit">Buat pesanan & invoice</button></div>
                        </form>
                    </div>
                </div>
                <div class="col-lg-5">
                    <div class="glass-card rounded-4 p-4 sticky-lg-top" style="top:100px">
                        <h2 class="h5 fw-bold">Ringkasan pesanan</h2>
                        <div id="checkout-summary" class="small"></div>
                        <hr>
                        <div class="d-flex justify-content-between"><span>Subtotal</span><strong id="checkout-subtotal">Rp0</strong></div>
                        <div class="d-flex justify-content-between mt-2"><span>Estimasi ongkir</span><strong id="checkout-shipping">Rp0</strong></div>
                        <div class="d-flex justify-content-between mt-3 fs-5"><strong>Total</strong><strong id="checkout-total">Rp0</strong></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div data-component="footer"></div>
    <div data-component="cart-drawer"></div>
    <div data-component="modal-member"></div>
    <div data-component="modal-produk"></div>
    <div data-component="invoice-preview"></div>
    <div data-component="toast-script"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module">
        async function loadComponent(el) {
            const name = el.dataset.component;
            try {
                const res = await fetch(`../components/${name}.html`);
                if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
                el.innerHTML = await res.text();
            } catch (err) {
                console.error(`Gagal memuat komponen "${name}":`, err);
            }
        }

        await Promise.all(
            Array.from(document.querySelectorAll('[data-component]')).map(loadComponent)
        );

        const script = document.createElement('script');
        script.src = '../assets/js/app.js';
        script.onload = () => {
            if (typeof window.onload === 'function') window.onload();
        };
        document.body.appendChild(script);
    </script>
</body>
</html>
