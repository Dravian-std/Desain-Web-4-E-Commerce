<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Livora — Katalog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/project.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cream: { 50: '#FDFBF7', 100: '#F9F5EC', 200: '#F1E9DA', 300: '#E5D8C1' },
                        oak: {
                            100: '#F4E8D6', 200: '#E6CFAF', 300: '#D8B892', 400: '#C49A6C', 500: '#A97B4B',
                            600: '#8C6239', 700: '#6E4B2A', 800: '#52371F', 900: '#382515'
                        },
                        charcoal: { 800: '#26211D', 900: '#171412' },
                        sage: { 50: '#F2F6F3', 100: '#E1ECE4', 600: '#3D6B4E', 700: '#2E523B' }
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
                        serif: ['"Cormorant Garamond"', 'serif'],
                        mono: ['"JetBrains Mono"', 'monospace']
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/tailwind.css">
</head>

<body class="font-sans antialiased selection:bg-oak-300 selection:text-charcoal-900">

    <div data-component="ambient"></div>
    <div data-component="navbar" class="sticky top-0 z-40 min-h-[64px]"></div>

    <main id="page-katalog" class="page-section block py-10 lg:py-14">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="text-center max-w-2xl mx-auto mb-8 fluid-reveal">
                <span class="inline-flex items-center gap-1.5 px-3.5 py-1 rounded-full glass-pill text-[11px] font-bold uppercase tracking-widest text-oak-700 mb-3">
                    <i class="fa-solid fa-cube text-oak-600"></i> Klik Produk Untuk Tampilan 3D Interaktif
                </span>
                <h1 class="text-3xl sm:text-5xl font-extrabold text-charcoal-900 tracking-tight">
                    Katalog Livora.
                </h1>
                <p class="text-xs sm:text-sm text-oak-700 mt-2">
                    16 koleksi ukuran presisi untuk Anak-anak, Remaja, Keluarga, hingga Lansia.
                </p>
            </div>

            <div class="glass-card rounded-2xl p-3 sm:p-4 mb-8 flex flex-wrap items-center justify-between gap-3 fluid-reveal">
                <div class="flex items-center gap-1.5 overflow-x-auto pb-1 sm:pb-0">
                    <button type="button" onclick="filterCatalogByAge('all')" data-age="all" class="age-filter-btn px-4 py-2 rounded-full bg-charcoal-900 text-cream-50 text-xs font-bold whitespace-nowrap transition-all">
                        Semua (16)
                    </button>
                    <button type="button" onclick="filterCatalogByAge('Anak-anak')" data-age="Anak-anak" class="age-filter-btn px-4 py-2 rounded-full hover:bg-white/70 text-charcoal-800 text-xs font-semibold whitespace-nowrap transition-all">
                        Anak-anak (4)
                    </button>
                    <button type="button" onclick="filterCatalogByAge('Remaja & Kos')" data-age="Remaja & Kos" class="age-filter-btn px-4 py-2 rounded-full hover:bg-white/70 text-charcoal-800 text-xs font-semibold whitespace-nowrap transition-all">
                        Remaja & Kos (4)
                    </button>
                    <button type="button" onclick="filterCatalogByAge('Dewasa & Keluarga')" data-age="Dewasa & Keluarga" class="age-filter-btn px-4 py-2 rounded-full hover:bg-white/70 text-charcoal-800 text-xs font-semibold whitespace-nowrap transition-all">
                        Keluarga (4)
                    </button>
                    <button type="button" onclick="filterCatalogByAge('Lansia / Senior')" data-age="Lansia / Senior" class="age-filter-btn px-4 py-2 rounded-full hover:bg-white/70 text-charcoal-800 text-xs font-semibold whitespace-nowrap transition-all">
                        Lansia (4)
                    </button>
                </div>

                <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
                    <input 
                        id="catalog-page-search"
                        type="text" 
                        oninput="onCatalogSearchInput(this.value)"
                        placeholder="Filter nama / ukuran cm..." 
                        class="flex-1 sm:w-52 px-3.5 py-1.5 rounded-full glass-pill bg-white/70 text-xs text-charcoal-900 focus:outline-none focus:ring-2 focus:ring-oak-400"
                    >
                    <button type="button" onclick="setCatalogViewMode('grid')" id="view-grid-btn" class="px-3 py-1.5 rounded-full bg-charcoal-900 text-cream-50 text-xs font-bold" title="Tampilan Grid Minimalis">
                        <i class="fa-solid fa-grip"></i>
                    </button>
                    <button type="button" onclick="setCatalogViewMode('row')" id="view-row-btn" class="px-3 py-1.5 rounded-full glass-pill text-charcoal-800 text-xs font-semibold" title="Tampilan Baris Dimensi">
                        <i class="fa-solid fa-bars"></i>
                    </button>
                </div>
            </div>

            <div id="full-catalog-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6"></div>
        </div>
    </main>

    <div data-component="footer"></div>
    <div data-component="cart-drawer"></div>
    <div data-component="modal-member"></div>
    <div data-component="modal-produk"></div>
    <div data-component="invoice-preview"></div>
    <div data-component="toast-script"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module">
        async function loadComponent(el) {
            const name = el.dataset.component;
            try {
                const res = await fetch(`../components/${name}.html`);
                if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
                el.innerHTML = await res.text();
            } catch (err) {
                console.error(`Gagal memuat komponen "${name}":`, err);
            }
        }

        await Promise.all(
            Array.from(document.querySelectorAll('[data-component]')).map(loadComponent)
        );

        const script = document.createElement('script');
        script.src = '../assets/js/app.js';
        script.onload = () => {
            if (typeof window.onload === 'function') window.onload();
        };
        document.body.appendChild(script);
    </script>
</body>
</html>
