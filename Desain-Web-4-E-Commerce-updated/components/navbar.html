<header class="sticky top-0 z-40 w-full glass-nav">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16 sm:h-18 gap-3 lg:gap-6">
                
                <button type="button" onclick="switchPage('home')" class="flex items-center gap-2.5 group shrink-0 focus:outline-none text-left">
                    <div class="w-9 h-9 rounded-xl bg-charcoal-900 text-cream-50 flex items-center justify-center shadow-xs group-hover:bg-oak-700 transition-colors">
                        <svg class="w-5 h-5 text-oak-200" viewBox="0 0 28 28" fill="none">
                            <rect x="3" y="8" width="22" height="10" rx="2" stroke="currentColor" stroke-width="2"/>
                            <line x1="10" y1="8" x2="10" y2="18" stroke="currentColor" stroke-width="1.6"/>
                            <line x1="18" y1="8" x2="18" y2="18" stroke="currentColor" stroke-width="1.6"/>
                            <path d="M6 18L4.5 23" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            <path d="M22 18L23.5 23" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                    </div>
                    <span class="text-xl font-extrabold tracking-tight text-charcoal-900">Livora</span>
                </button>

                <div class="flex-1 max-w-2xl flex items-center justify-center gap-2 lg:gap-6">
                    <nav class="hidden md:flex items-center gap-1 p-1 rounded-full glass-pill">
                        <button type="button" onclick="switchPage('home')" id="nav-home" class="nav-tab-btn px-4 py-1.5 rounded-full bg-charcoal-900 text-cream-50 text-xs font-semibold transition-all">
                            Beranda
                        </button>
                        <button type="button" onclick="switchPage('katalog')" id="nav-katalog" class="nav-tab-btn px-4 py-1.5 rounded-full text-charcoal-800 hover:text-charcoal-900 text-xs font-medium transition-all flex items-center gap-1.5">
                            <span>Katalog</span>
                            <span class="text-[10px] font-mono px-1.5 py-0.2 rounded-full bg-oak-200/70 text-oak-900">16</span>
                        </button>
                        <button type="button" onclick="switchPage('inspirasi')" id="nav-inspirasi" class="nav-tab-btn px-4 py-1.5 rounded-full text-charcoal-800 hover:text-charcoal-900 text-xs font-medium transition-all">
                            Inspirasi Ruang
                        </button>
                        <button type="button" onclick="switchPage('riwayat')" id="nav-riwayat" class="nav-tab-btn px-4 py-1.5 rounded-full text-charcoal-800 hover:text-charcoal-900 text-xs font-medium transition-all flex items-center gap-1.5">Riwayat</button>
                        <button type="button" onclick="switchPage('ongkir')" id="nav-ongkir" class="nav-tab-btn px-4 py-1.5 rounded-full text-charcoal-800 hover:text-charcoal-900 text-xs font-medium transition-all">
                            Cek Ongkir
                        </button>
                    </nav>

                    <div class="relative flex-1 max-w-xs">
                        <div class="relative flex items-center">
                            <i class="fa-solid fa-magnifying-glass text-oak-600 text-xs absolute left-3.5 pointer-events-none"></i>
                            <input 
                                id="global-search-input"
                                type="text" 
                                placeholder="Cari credenza, meja, sofa..." 
                                class="w-full pl-9 pr-7 py-1.5 glass-pill focus:bg-white/90 text-xs text-charcoal-900 rounded-full focus:outline-none focus:ring-2 focus:ring-oak-400 transition-all placeholder:text-oak-700/65"
                            >
                            <button id="clear-search-btn" type="button" class="hidden absolute right-2.5 text-xs text-oak-600 hover:text-charcoal-900">✕</button>
                        </div>

                        <div id="search-suggestions" class="hidden absolute left-0 right-0 mt-2 glass-card bg-cream-50/95 rounded-2xl p-2.5 z-50">
                            <div class="flex items-center justify-between px-2 pb-1.5 mb-1 border-b border-oak-200/60">
                                <span class="text-[10px] font-bold uppercase tracking-wider text-oak-600">Pencarian Cepat</span>
                                <button type="button" onclick="switchPage('katalog')" class="text-[11px] font-bold text-oak-700 hover:underline">Semua (16) ›</button>
                            </div>
                            <div id="search-suggestions-list" class="space-y-1 max-h-60 overflow-y-auto"></div>
                        </div>
                    </div>
                </div>

                <div class="flex items-center gap-2 shrink-0">
                    <button 
                        type="button"
                        onclick="switchPage('ongkir')"
                        class="glass-pill hover:bg-white/80 px-3 py-1.5 rounded-full text-xs font-semibold text-charcoal-800 flex items-center gap-1.5 transition-all"
                        title="Cek Ongkir Kargo"
                    >
                        <i class="fa-solid fa-location-dot text-oak-600 text-[11px]"></i>
                        <span id="header-postal-display" class="font-mono text-[11px] font-bold hidden sm:inline">50275 • Semarang</span>
                        <span id="header-postal-mobile" class="font-mono text-[11px] font-bold sm:hidden">50275</span>
                    </button>

                    <button 
                        id="cart-open-btn"
                        type="button" 
                        class="relative w-9 h-9 rounded-full glass-pill hover:bg-white/80 flex items-center justify-center text-charcoal-900 transition-all"
                        aria-label="Keranjang"
                    >
                        <i class="fa-solid fa-bag-shopping text-xs"></i>
                        <span id="cart-count-badge" class="absolute -top-1 -right-1 min-w-[18px] h-[18px] px-1 rounded-full bg-charcoal-900 text-cream-50 font-mono text-[10px] font-bold flex items-center justify-center">
                            1
                        </span>
                    </button>

                    <button 
                        id="profile-btn"
                        type="button"
                        onclick="openMemberModal()"
                        class="relative h-9 px-3 rounded-full glass-pill hover:bg-white/85 flex items-center justify-center gap-1.5 text-xs font-bold text-charcoal-900 transition-all"
                        title="Daftar / Akun Member"
                    >
                        <span id="profile-avatar-icon" class="flex items-center justify-center">
                            <i class="fa-regular fa-user text-xs text-oak-700"></i>
                        </span>
                        <span id="profile-label-text" class="hidden sm:inline text-[11px] font-semibold text-charcoal-800">Daftar</span>
                        <span id="profile-online-dot" class="hidden absolute -top-0.5 -right-0.5 w-2.5 h-2.5 rounded-full bg-emerald-500 ring-2 ring-cream-50"></span>
                    </button>
                </div>

            </div>

            <div class="flex md:hidden items-center justify-center gap-1.5 py-2 border-t border-white/50 text-xs overflow-x-auto">
                <button type="button" onclick="switchPage('home')" id="mob-nav-home" class="px-3.5 py-1 rounded-full bg-charcoal-900 text-cream-50 font-semibold whitespace-nowrap">Beranda</button>
                <button type="button" onclick="switchPage('katalog')" id="mob-nav-katalog" class="px-3.5 py-1 rounded-full glass-pill text-charcoal-800 whitespace-nowrap">Katalog (16)</button>
                <button type="button" onclick="switchPage('inspirasi')" id="mob-nav-inspirasi" class="px-3.5 py-1 rounded-full glass-pill text-charcoal-800 whitespace-nowrap">Inspirasi</button>
                <button type="button" onclick="switchPage('riwayat')" id="mob-nav-riwayat" class="px-3.5 py-1 rounded-full glass-pill text-charcoal-800 whitespace-nowrap">Riwayat</button>
                <button type="button" onclick="switchPage('ongkir')" id="mob-nav-ongkir" class="px-3.5 py-1 rounded-full glass-pill text-charcoal-800 whitespace-nowrap">Cek Ongkir</button>
            </div>
        </div>
    </header>
